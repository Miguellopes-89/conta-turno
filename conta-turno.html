<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conta-turno</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #181a1b;
            color: #ececea;
        }
        .container { width: min(90%, 460px); text-align: center; }
        h1 { margin: 0 0 8px; font-size: 1rem; font-weight: 500; color: #a6aaa7; }
        .weekdays {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 24px;
            padding: 0;
            list-style: none;
            font-size: .7rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #686d69;
        }
        .weekdays .today { color: #ececea; font-weight: 600; }
        .config-box {
            display: grid;
            gap: 14px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #343837;
        }
        .config-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .config-row:first-child { justify-content: center; }
        label { font-size: .85rem; color: #a6aaa7; }
        input[type="time"] {
            padding: 5px 4px;
            border: 0;
            border-bottom: 1px solid #686d69;
            border-radius: 0;
            outline: none;
            font: inherit;
            font-size: 1rem;
            color: #ececea;
            background: transparent;
        }
        input[type="time"]:focus { border-color: #d6dad6; }
        #countdown { margin: 0; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: clamp(3rem, 13vw, 5rem); font-weight: 500; letter-spacing: -.08em; }
        .finished { color: #276749; }
        .lunch { color: #a16207; }
        .info-text { margin: 0; font-size: .85rem; color: #a6aaa7; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="container">
        <h1 id="title-display">conta-turno</h1>
        <ul id="weekdays" class="weekdays" aria-label="Dias da semana"></ul>
        <div id="countdown">00:00:00</div>
        <div id="lunch-info" class="info-text"></div>

        <section class="config-box" aria-label="Horários">
            <div class="config-row">
                <label for="exitTimeInput">Hora de saída:</label>
                <input type="time" id="exitTimeInput" value="17:00">
            </div>
            <div class="config-row">
                <label for="lunchStartInput">Início do almoço:</label>
                <input type="time" id="lunchStartInput" value="12:00">
                <label for="lunchEndInput">Fim:</label>
                <input type="time" id="lunchEndInput" value="13:00">
            </div>
        </section>

    </main>

    <script>
        const inputs = {
            exit: document.getElementById('exitTimeInput'),
            lunchStart: document.getElementById('lunchStartInput'),
            lunchEnd: document.getElementById('lunchEndInput')
        };
        const weekdaysElement = document.getElementById('weekdays');
        const countdownElement = document.getElementById('countdown');
        const titleDisplay = document.getElementById('title-display');
        const lunchInfoElement = document.getElementById('lunch-info');

        function loadSavedTime(input, storageKey) {
            const savedTime = localStorage.getItem(storageKey);
            if (savedTime) input.value = savedTime;
        }

        function timeToday(time) {
            const [hours, minutes] = time.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);
            return date;
        }

        function formatClock(date) {
            return date.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatDuration(milliseconds) {
            const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
        }

        function showInvalidLunch() {
            countdownElement.classList.remove('finished', 'lunch');
            countdownElement.textContent = '—';
            titleDisplay.textContent = 'conta-turno · verifica o almoço';
            lunchInfoElement.textContent = 'O fim do almoço tem de ser posterior ao início.';
            lunchInfoElement.classList.add('error');
            document.title = 'Horário de almoço inválido';
        }

        let renderedDateString = null;

        function renderWeekdays(now) {
            const currentDateString = now.toDateString();
            if (currentDateString === renderedDateString) return;
            renderedDateString = currentDateString;

            const dayLabels = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
            const todayIndex = (now.getDay() + 6) % 7; // 0 = Segunda, 6 = Domingo
            weekdaysElement.innerHTML = dayLabels
                .map((label, index) => `<li${index === todayIndex ? ' class="today"' : ''}>${label}</li>`)
                .join('');
        }

        function updateCountdown() {
            const now = new Date();
            renderWeekdays(now);
            const exitTime = timeToday(inputs.exit.value);
            const lunchStartTime = timeToday(inputs.lunchStart.value);
            const lunchEndTime = timeToday(inputs.lunchEnd.value);

            if (lunchEndTime <= lunchStartTime) {
                showInvalidLunch();
                return;
            }

            const lunchDuration = lunchEndTime - lunchStartTime;
            lunchInfoElement.classList.remove('error');
            lunchInfoElement.textContent = `Intervalo de almoço: ${formatClock(lunchStartTime)} às ${formatClock(lunchEndTime)}`;
            countdownElement.classList.remove('finished', 'lunch');

            if (now >= exitTime) {
                const message = 'Hora de ir embora! 🎉';
                countdownElement.textContent = message;
                countdownElement.classList.add('finished');
                titleDisplay.textContent = 'conta-turno · trabalho concluído!';
                document.title = message;
                return;
            }

            if (now >= lunchStartTime && now < lunchEndTime) {
                const message = 'Em pausa para almoço 🥪';
                countdownElement.textContent = message;
                countdownElement.classList.add('lunch');
                titleDisplay.textContent = 'conta-turno · intervalo';
                document.title = message;
                return;
            }

            let remainingWorkTime = exitTime - now;
            if (now < lunchStartTime) remainingWorkTime -= lunchDuration;

            const timeString = formatDuration(remainingWorkTime);
            titleDisplay.textContent = `conta-turno · saída às ${inputs.exit.value}`;
            countdownElement.textContent = timeString;
            document.title = `⏱️ ${timeString} restantes`;
        }

        const savedTimes = [
            [inputs.exit, 'savedExitTime'],
            [inputs.lunchStart, 'savedLunchStartTime'],
            [inputs.lunchEnd, 'savedLunchEndTime']
        ];

        savedTimes.forEach(([input, storageKey]) => {
            loadSavedTime(input, storageKey);
            input.addEventListener('change', () => {
                localStorage.setItem(storageKey, input.value);
                updateCountdown();
            });
        });

        function scheduleNextTick() {
            const driftMs = Date.now() % 1000;
            setTimeout(() => {
                updateCountdown();
                scheduleNextTick();
            }, 1000 - driftMs);
        }

        updateCountdown();
        scheduleNextTick();
    </script>
</body>
</html>
